services:

  web:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    restart: unless-stopped

  scheduler:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    command: python manage.py run_scheduler
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
