[project]
name = "selectorwatch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "django>=5.0",
    "lxml>=5.0.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
