<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SelectorWatch{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .badge-ok    { background-color: #198754; }
    .badge-fail  { background-color: #dc3545; }
    .badge-nodata{ background-color: #6c757d; }
    .diff-table  { font-size: .75rem; width: 100%; border-collapse: collapse; }
    .diff-table td, .diff-table th { padding: 2px 6px; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
    .diff-header { background: #343a40; color: #fff; }
    .diff_add    { background: #d4edda; }
    .diff_chg    { background: #fff3cd; }
    .diff_sub    { background: #f8d7da; }
    pre.fragment { max-height: 300px; overflow: auto; font-size: .78rem; background: #212529; color: #f8f9fa; padding: 1rem; border-radius: .375rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">
      <i class="bi bi-eye-fill text-warning me-1"></i>SelectorWatch
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="{% url 'dashboard' %}">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_events %}{% endblock %}" href="{% url 'event_list' %}">
            <i class="bi bi-exclamation-triangle"></i> Eventos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_history %}{% endblock %}" href="{% url 'history' %}">
            <i class="bi bi-clock-history"></i> Histórico
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_sites %}{% endblock %}" href="{% url 'site_list' %}">
            <i class="bi bi-globe"></i> Sites
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/admin/" target="_blank">
            <i class="bi bi-gear"></i> Admin
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
